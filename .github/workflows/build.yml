name: Build ChestLogger
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper JAR
        run: gradle wrapper

      - name: Repair and prepare Gradle wrapper
        run: |
          sed -i 's/\r$//' gradlew
          sed -i 's/DEFAULT_JVM_OPTS=.*/DEFAULT_JVM_OPTS="-Xmx64m -Xms64m"/' gradlew
          chmod +x ./gradlew

      - name: Build and Remap
        run: ./gradlew build remapJar

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChestTrace-Production-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-dev.jar
            !build/libs/*-sources.jar
