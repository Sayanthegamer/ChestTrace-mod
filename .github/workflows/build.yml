name: Build ChestLogger
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and Remap
        # This forces Fabric Loom to generate the remapped production JAR
        run: ./gradlew build remapJar

      - name: Upload Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChestTrace-Production-JAR
          # This regex strictly grabs the remapped JAR and ignores the broken -dev and -sources files
          path: build/libs/*[!dev][!sources].jar
